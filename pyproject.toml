[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bfme2-map-workshop"
version = "0.1.0"
description = "Build, view and mark Battle for Middle-earth II maps from code, rendered like the game"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
dependencies = ["numpy==2.5.3", "Pillow==12.3.0"]

[project.scripts]
mw = "mapworkshop.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["mapworkshop*", "maps*"]
exclude = ["*.tests", "*.tests.*", "*.__pycache__*"]

[tool.setuptools.package-data]
"mapworkshop.mapkit" = ["data/*.json"]
"mapworkshop.templates" = ["new_map/*.tmpl"]
